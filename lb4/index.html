<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб4</title>
</head>

<body>
    <header>
        <h1>Студентська картка</h1>
    </header>
    <main>
        <section>
            <form action="." method="get">
                <h2>Персональна інформація</h2>
                <fieldset>
                    <legend> Надайте свої дані</legend>

                    <p>
                        <label for="name">Повне ім'я:</label>
                        <input type="text" id="name" name="name">
                    </p>

                    <p>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password">
                    </p>

                    <p>
                        <label for="age">Вік:</label>
                        <input type="number" id="age" name="age">
                    </p>

                    <p>
                        <label for="data">Дата народження:</label>
                        <input type="data" id="data" name="data">
                    </p>

                    <p>
                        <label for="gender">Стать:</label>
                    <section>
                        <input type="radio" id="male" name="gender" value="male"><label for="male">Чоловіча</label>
                    </section>
                    <section>
                        <input type="radio" id="female" name="gender" value="female"><label for="female">Жіноча</label>
                    </section>
                    <section>
                        <input type="radio" id="other" name="gender" value="other"><label for="other">Інша</label>
                    </section>
                    </p>

                    <p>
                        <label for="languages">Знання мов:</label>
                    <section>
                        <input type="checkbox" id="english" name="languages" value="english">
                        <label for="english">Англійська</label>
                    </section>
                    <section>
                        <input type="checkbox" id="spanish" name="languages" value="spanish">
                        <label for="spanish">Іспанська</label>
                    </section>
                    <section>
                        <input type="checkbox" id="french" name="languages" value="french">
                        <label for="french">Французька</label>
                    </section>
                    </p>

                    <p>
                        <label for="country">Країна:</label>
                        <select name="country" id="country">
                            <option value="ukraine">Україна</option>
                            <option value="kazahstan">Казахстан</option>
                            <option value="romania">Румунія</option>
                            <option value="poland">Польща</option>
                            </optgroup>
                        </select>
                    </p>
                </fieldset>
                <h2>Навчальна дисципліна в коледжі:</h2>
                <fieldset>
                    <legend>Оберіть дисципліну</legend>
                    <label for="subject">Дисципліни:</label>
                    <section>
                    <select multiple name="subject" id="subject">
                        <option value="mathematics">Математика</option>
                        <option value="computer Science">Комп'ютерні науки</option>
                        <option value="physics">Фізика</option>
                        <option value="chemistry">Хімія</option>
                        <option value="English">Англійська</option>
                    </select>
                </section>
                    <p>
                        <label for="range">Оцініть свій інтерес до дисципліни</label>
                        <input type="range">

                    </p>
                </fieldset>
                <h2>Оцінювання навичок</h2>
                <fieldset>
                    <legend>Оцініть свої навички</legend>
                    <label for="textarea">Опишіть свої навички</label>
                    <section>
                        <textarea name="textarea" rows="4" cols="50" id="textarea"></textarea>
                    </section>
                    <p>
                        <label for="file">Завантажте своє резюме</label>
                        <input type="file">
                    </p>
                    <p>
                        <label for="color">Виберіть ваш улюблений колір:</label>
                        <input type="color">
                    </p>
                    <p>
                        <label for="time">Бажаний час навчання:</label>
                        <input type="time">
                    </p>
                    <p>
                        <button type="submit"> Надіслати опитуваання</button>
                    </p>
                </fieldset>
            </form>
        </section>
        <p>&copy; Student card by Kushnir Rostislav. All rights reserved</p>
    </main>
</body>

</html>
