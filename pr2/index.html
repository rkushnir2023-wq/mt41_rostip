<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pr2</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <section class="main_page">
            <h1>Pet Store & Beyond</h1>
            <h3>Fresh ingredients slowly baked into our super delicious food. Available in a range of delicious
                flavours, delivered to your door</h3>
        </section class="main_page">
    </header>

    <main>
        <section class="video-section">
            <img src="assets/Video.png" controls width="765" height="460">
        </section class="video-section">

        <section class="companys">
            <img src="assets/Logos group.svg" alt="Pet Store Logo" width="1280" height="400">
        </section class="companys">

        <section class="products">

        </section class="products">

        <section class="testimonials">
            <img src="assets/Frame.png" alt="Pet Store Logo" style="width: 662px; height: 233px;">
        </section class="testimonials">

        <section class="contact">
            <h1>Let’s talk, woof!</h1>
            <h3>You can ask us questions about your pet, and we will be happy to answer you!</h3>
        </section class="contact">
    </main>

    <footer>
        <p>PETWORLD 2023 </p>
    </footer>
</body>

</html>
