<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pr2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

    </header>

    <main>
        <section>
            <div class="main_page">
                <h1>Pet Store & Beyond</h1>
                <p>Fresh ingredients slowly baked into our super delicious food. Available in a range of delicious
                    flavours, delivered to your door</p>
                <button id="button">Get Started</button>
            </div>
        </section>

        <section>
            <div class="video-section">
                <img src="assets/Video.png" controls width="765" height="460">
            </div>
        </section>

        <section>
            <div class="companys">
                <img src="assets/Logos group.svg" alt="Pet Store Logo" width="1280" height="400">
            </div>
        </section>

        <section>
            <div class="products">
                
            </div>
        </section>

        <section>
            <div class="testimonials">
                <img src="assets/Frame.png" alt="Pet Store Logo" style="width: 662px; height: 233px;">
            </div>
        </section>

        <section>
            <div class="contact">
                <h1>Let’s talk, woof!</h1>
                <h3>You can ask us questions about your pet, and we will be happy to answer you!</h3>
                <button id="button">Contact Us</button>
            </div>
        </section>
    </main>

    <footer>
        <p>PETWORLD 2023 </p>
    </footer>
</body>

</html>
